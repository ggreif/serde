name: Release

# Automatic publishing is DEACTIVATED: pushing a v*.*.* tag no longer publishes.
# It never worked here anyway — every tag run (v0.1.2 … v0.2.0) died in "Commit
# updated mops.toml", because a tag push checks out a detached HEAD with no branch
# to commit onto — and releases have been cut by hand with `mops publish` instead.
#
# Left runnable via workflow_dispatch as an escape hatch. NOTE that the
# "Set version from tag" step below derives the version from GITHUB_REF_NAME, so a
# dispatch run from a branch would write that branch's name into mops.toml; fix
# that step (and the commit step) before relying on this path.
#
# To re-enable automatic publishing, restore:
#   push:
#     tags:
#       - "v*.*.*"

on:
    workflow_dispatch:

jobs:
    publish-mops:
        name: Publish to Mops
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dfinity/setup-dfx@main
            - uses: ZenVoich/setup-mops@v1
              with:
                  mops-version: 2.8.1
                  identity-pem: ${{ secrets.MOPS_IDENTITY_PEM }}
    
            - name: Install dependencies
              run: mops install --lock ignore
    
            - name: Set version from tag in mops.toml
              run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" mops.toml

            - name: Commit updated mops.toml
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add mops.toml
                git commit -m "updated mops version to ${GITHUB_REF_NAME} [skip ci]"
                git push origin HEAD:main

            - name: Publish
              run: mops publish
