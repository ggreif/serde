name: Makefile CI

on:
  push:
    # `core` is this fork's default branch; `main` is kept so the trigger keeps
    # working if the canonical branch is ever renamed back.
    branches:
      - core
      - main
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    name: Build and test
    steps:
      - uses: actions/checkout@v7
      # No replica step: every test in this repo is `@testmode wasi`, so `mops
      # test` needs moc + wasmtime only, both provided by the mops toolchain.
      - uses: ZenVoich/setup-mops@v1
        with:
            mops-version: 2.22.0
            identity-pem: ${{ secrets.MOPS_IDENTITY_PEM }}

      # setup-mops pins Node 22 internally (actions/setup-node v4.4.0,
      # `node-version: 22`, with no input to override), so switch afterwards and
      # reinstall the CLI under Node 24 — switching Node also switches the global
      # npm prefix, so the mops installed by the action would otherwise fall off
      # PATH. ic-mops declares `engines: node >=18`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reinstall mops on Node 24
        run: npm i -g ic-mops@2.22.0

      - name: Install dependencies
        run: mops install --lock ignore

      # - name: Detect warnings
      #   run: make check

      - name: Run Tests
        run: mops test
