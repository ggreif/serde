name: Benchmarks

on:
  push:
    # `core` is this fork's default branch; `main` is kept so the trigger keeps
    # working if the canonical branch is ever renamed back.
    branches:
      - core
      - main
  pull_request:
    branches:
      - "*"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    name: Run Benchmarks and Comment

    steps:
      - uses: actions/checkout@v7
      # `dfx` replaced by `pocket-ic`: mops' own help marks `dfx` deprecated, and
      # the "use icp-cli" warnings that flooded these logs came from dfx itself.
      # mops provisions pocket-ic from `[toolchain]` in mops.toml.
      - uses: ZenVoich/setup-mops@v1
        with:
            mops-version: 2.22.0
            identity-pem: ${{ secrets.MOPS_IDENTITY_PEM }}

      # setup-mops pins Node 22 internally (actions/setup-node v4.4.0,
      # `node-version: 22`, with no input to override), so switch afterwards and
      # reinstall the CLI under Node 24 — switching Node also switches the global
      # npm prefix, so the mops installed by the action would otherwise fall off
      # PATH. ic-mops declares `engines: node >=18`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reinstall mops on Node 24
        run: npm i -g ic-mops@2.22.0

      - name: Install dependencies
        run: mops install --lock ignore

      # setup-mops exports DFX_MOC_PATH=moc-wrapper, and that wrapper resolves the
      # compiler via `mops toolchain bin moc --fallback`, whose fallback is "the moc
      # that comes with dfx" — so every compile probed dfx and logged
      # `/bin/sh: 1: dfx: not found` now that dfx is gone. moc is pinned in
      # [toolchain], so point at it directly and skip the probe.
      - name: Point DFX_MOC_PATH at the pinned moc
        run: echo "DFX_MOC_PATH=$(mops toolchain bin moc)" >> "$GITHUB_ENV"

      # Was peterjgrainger/action-create-branch@v2.2.0, which emits the deprecated
      # `set-output` command and runs on Node 20. Creating the branch is two lines
      # of git, so the action (and its deprecations) are not worth carrying.
      - name: Create benchmark-results branch if it doesn't exist
        run: |
          if git ls-remote --exit-code --heads origin benchmark-results >/dev/null; then
            echo "benchmark-results already exists"
          else
            git push origin "HEAD:refs/heads/benchmark-results"
          fi
        continue-on-error: true

      - name: Checkout out the branch with benchmark results
        uses: actions/checkout@v7
        with:
          ref: benchmark-results
          path: .benchmark-results-branch/

      # Normalise the baseline instead of `mv`-ing it: `mv src dst` nests when `dst`
      # already exists, and successive saves had stacked three generations on the
      # branch (.bench/.bench/.bench/...). Only the top level is ever read, so the
      # nests were dead weight that made the oldest benches — serde and types —
      # compare against a mixture of generations.
      - name: Move Saved Benchmarks
        run: |
          rm -rf .bench && mkdir -p .bench
          cp .benchmark-results-branch/.bench/*.json .bench/ 2>/dev/null || \
            echo "no baseline yet — this run establishes it"

      - name: Pull Request Benchmarks
        if: github.event_name == 'pull_request'
        id: benchmarks
        run: |
          # No 2>&1: this file is pasted verbatim into the PR comment, so stderr
          # (deprecation notices, replica chatter) must stay in the job log only.
          set -o pipefail
          mops bench --replica pocket-ic --gc incremental --compare | tee benchmark_results.txt
          echo "result<<EOF" >> $GITHUB_OUTPUT
          cat benchmark_results.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Find Benchmark Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Benchmark Results

      - name: Create or update comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.benchmarks.outputs.result }}
          edit-mode: replace

      - name: Generate Benchmark Results
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          mops bench --replica pocket-ic --gc incremental --save --compare | tee bench-results.md
      - name: Move Generated Results
        if: github.event_name != 'pull_request'
        run: |
          mkdir .bench-br
          mv .bench .bench-br/.bench
          mv bench-results.md .bench-br/README.md 2>/dev/null || mkdir -p .bench
      - name: Upload benchmark results
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: benchmark-results
          folder: .bench-br
