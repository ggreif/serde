[package]
name = "serde-core"
version = "0.2.0"
description = "A serialisation and deserialisation library for Motoko."
repository = "https://github.com/NatLabs/serde"
keywords = [ "json", "candid", "cbor", "urlencoded", "serialization" ]
license = "MIT"

[dependencies]
core = "2.4.0"
sha2 = "0.2.5"

[dev-dependencies]
"base@0.16" = "0.16.0"
"map@9.0" = "9.0.1"
test = "2.1.2"
fuzz = "1.0.0"
rep-indy-hash = "0.2.1"
candid = "2.4.2"
bench = "2.0.1"

[toolchain]
wasmtime = "47.0.3"
moc = "1.6.0"
# Benchmarks run on pocket-ic; `dfx` is deprecated per mops' own help.
pocket-ic = "15.0.0"
